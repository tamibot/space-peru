name: Verify site sources (hosting on AWS)
on:
  push:
    branches: [main]
    paths: ['landing/**', 'app/web/**', 'scripts/**', 'data/public/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node landing/src/check.mjs
      - run: node app/scripts/check-web.cjs
